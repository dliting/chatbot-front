<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天组件 - 悬浮窗模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* 主内容区域 */
    .main-content {
      min-height: 100vh;
      padding: 40px;
      background: linear-gradient(180deg, #f0f4ff 0%, #e8f0ff 100%);
    }
    .main-content header {
      max-width: 800px;
      margin: 0 auto 40px;
      text-align: center;
    }
    .main-content h1 {
      font-size: 42px;
      color: #1a1a2e;
      margin-bottom: 16px;
    }
    .main-content p {
      font-size: 18px;
      color: #6b7280;
      line-height: 1.6;
    }
    .main-content .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .main-content .feature-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.1);
      transition: transform 0.3s ease;
    }
    .main-content .feature-card:hover {
      transform: translateY(-4px);
    }
    .main-content .feature-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .main-content .feature-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .main-content .feature-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* AI 聊天组件容器 */
    #ai-chatbot {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
    #ai-chatbot > * {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <!-- 主内容区域 -->
  <main class="main-content">
    <header>
      <h1>AI 智能助手 - 悬浮窗模式</h1>
      <p>点击右下角的悬浮球打开聊天窗口，随时与 AI 对话</p>
    </header>

    <section class="features">
      <div class="feature-card">
        <div class="feature-icon">💬</div>
        <div class="feature-title">智能对话</div>
        <div class="feature-desc">基于大语言模型的智能对话系统，理解自然语言，提供精准回答。</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">⚡</div>
        <div class="feature-title">实时响应</div>
        <div class="feature-desc">流式输出技术，让回复像打字一样逐字显示，体验更自然。</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📎</div>
        <div class="feature-title">文件上传</div>
        <div class="feature-desc">支持图片、文档等多种文件格式，AI 可分析内容并给出建议。</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎨</div>
        <div class="feature-title">多种主题</div>
        <div class="feature-desc">内置浅色/深色主题，支持自定义品牌色，完美融入您的产品。</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📱</div>
        <div class="feature-title">响应式设计</div>
        <div class="feature-desc">自动适配桌面、平板、手机等不同屏幕尺寸。</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🔧</div>
        <div class="feature-title">灵活集成</div>
        <div class="feature-desc">支持悬浮窗、侧边栏、全屏多种模式，轻松集成到任何页面。</div>
      </div>
    </section>
  </main>

  <!-- AI 聊天组件容器 -->
  <div id="ai-chatbot"></div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
    import AIChatbot from '../src/components/AIChatbot.vue'

    const app = createApp(AIChatbot, {
      config: {
        position: 'bottom-right',
        theme: 'light',
        primaryColor: '#667eea',
        panelMode: 'dialog',
        panelWidth: 400,
        enableSessionManager: false,
        labels: {
          title: 'AI 助手',
          placeholder: '输入您的问题...',
        },
        enableImageUpload: true,
        maxImageCount: 3,
      }
    })

    app.mount('#ai-chatbot')
  </script>
</body>
</html>
