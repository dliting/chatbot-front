<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紧凑模式 - AI Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .demo-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .demo-container h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .demo-container .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .demo-container .description {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #409eff;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    .feature {
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .feature h3 {
      font-size: 14px;
      color: #409eff;
      margin-bottom: 8px;
    }

    .feature p {
      font-size: 13px;
      color: #666;
      margin: 0;
    }

    /* Phone mock frame */
    .phone-mock {
      width: 375px;
      height: 667px;
      margin: 40px auto;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 32px;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .demo-container {
        padding: 20px;
      }

      .phone-mock {
        width: 100%;
        height: 500px;
        border-radius: 20px;
        padding: 8px;
      }

      .phone-screen {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <a href="/" class="back-link">← 返回首页</a>
    <h1>紧凑模式</h1>
    <p class="subtitle">Compact Mode</p>
    <p class="description">
      此模式提供紧凑的聊天界面，适用于桌面端边栏或移动端全屏场景。<br>
      在桌面端可作为边栏显示，在移动端则自动适配为全屏界面。
    </p>

    <div class="features">
      <div class="feature">
        <h3>桌面边栏</h3>
        <p>固定侧边栏，不遮挡主内容</p>
      </div>
      <div class="feature">
        <h3>移动全屏</h3>
        <p>移动端自动适配全屏显示</p>
      </div>
      <div class="feature">
        <h3>会话管理</h3>
        <p>支持多会话切换和管理</p>
      </div>
      <div class="feature">
        <h3>图片上传</h3>
        <p>支持发送图片消息</p>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/entries/compact.ts"></script>
</body>
</html>
