<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紧凑模式 - AI Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* 主内容区域 */
    .main-content {
      flex: 1;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow-y: auto;
    }

    .main-content h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .main-content p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .main-content .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
    }

    .main-content .card h2 {
      margin-bottom: 16px;
    }

    .main-content .card ul {
      padding-left: 20px;
    }

    .main-content .card li {
      margin-bottom: 8px;
    }

    /* AI 聊天侧边栏容器 */
    #ai-chat-sidebar {
      width: 400px;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .main-content {
        display: none;
      }

      #ai-chat-sidebar {
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <!-- 主内容区域 -->
  <main class="main-content">
    <h1>欢迎使用 AI 智能助手</h1>
    <p>这是一个演示页面，展示 AI 聊天组件作为侧边栏的用法。</p>

    <div class="card">
      <h2>功能特点</h2>
      <ul>
        <li>侧边栏固定显示，不影响主内容浏览</li>
        <li>支持会话管理，可创建多个对话</li>
        <li>实时流式响应，体验流畅</li>
        <li>支持图片上传、语音输入</li>
      </ul>
    </div>

    <div class="card">
      <h2>紧凑模式说明</h2>
      <p>在桌面端，聊天组件显示为右侧边栏，与主内容并列展示。在移动端，组件自动切换为全屏模式，提供完整的聊天体验。</p>
    </div>

    <div class="card">
      <h2>响应式设计</h2>
      <p>当屏幕宽度小于 768px 时，主内容自动隐藏，聊天组件占满整个屏幕，为移动用户提供优化的体验。</p>
    </div>
  </main>

  <!-- AI 聊天侧边栏 -->
  <aside id="ai-chat-sidebar"></aside>

  <script type="module" src="/src/entries/compact.ts"></script>
</body>
</html>
