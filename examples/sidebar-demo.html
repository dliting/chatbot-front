<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天组件 - 边栏模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
    }
    /* 主内容区域 */
    .main-content {
      flex: 1;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow-y: auto;
    }
    .main-content h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .main-content p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }
    .main-content .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
    }
    /* AI 聊天侧边栏容器 */
    #ai-chat-sidebar {
      width: 400px;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <!-- 主内容区域 -->
  <main class="main-content">
    <h1>欢迎使用 AI 智能助手</h1>
    <p>这是一个演示页面，展示 AI 聊天组件作为侧边栏的用法。</p>
    <div class="card">
      <h2>功能特点</h2>
      <ul style="margin-top: 16px; padding-left: 20px;">
        <li>侧边栏固定显示，不影响主内容浏览</li>
        <li>支持会话管理，可创建多个对话</li>
        <li>实时流式响应，体验流畅</li>
        <li>支持图片上传、语音输入</li>
      </ul>
    </div>
  </main>

  <!-- AI 聊天侧边栏 -->
  <aside id="ai-chat-sidebar"></aside>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
    import AIChatbot from '../src/components/AIChatbot.vue'

    const app = createApp(AIChatbot, {
      config: {
        position: 'right',
        theme: 'light',
        primaryColor: '#667eea',
        panelMode: 'sidebar',
        panelWidth: 400,
        enableSessionManager: true,
        labels: {
          title: 'AI 助手',
          newChat: '新建对话',
          placeholder: '输入消息...',
        },
        enableImageUpload: true,
        maxImageCount: 3,
      }
    })

    // 修改面板默认打开状态
    app.config.globalProperties.$forcePanelOpen = true

    app.mount('#ai-chat-sidebar')
  </script>
</body>
</html>
