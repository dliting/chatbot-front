<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天组件 - 全屏模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 使用构建后的库 -->
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
    import AIChat from '../src/components/AIChat.vue'

    const app = createApp(AIChat, {
      mode: 'standalone',
      hideHeader: false,
      hideWelcome: false,
      hideQuickActions: false,
      config: {
        labels: {
          title: 'AI 智能助手',
          placeholder: '输入您的问题...',
        },
        enableImageUpload: true,
        maxImageCount: 3,
        maxImageSize: 5 * 1024 * 1024, // 5MB
      }
    })

    app.mount('#app')
  </script>
</body>
</html>
