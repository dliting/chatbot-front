<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬浮模式（→扩展）- AI Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .demo-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .demo-container h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .demo-container .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .demo-container .description {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #409eff;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    .feature {
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .feature h3 {
      font-size: 14px;
      color: #409eff;
      margin-bottom: 8px;
    }

    .feature p {
      font-size: 13px;
      color: #666;
      margin: 0;
    }

    .instruction {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .instruction-icon {
      font-size: 24px;
    }

    .instruction-text {
      font-size: 14px;
      color: #0050b3;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <a href="/" class="back-link">← 返回首页</a>
    <h1>悬浮模式（→扩展）</h1>
    <p class="subtitle">Floating to Extended Mode</p>
    <p class="description">
      此模式显示一个悬浮球按钮，点击后打开完整的桌面聊天界面（扩展模式）。
    </p>

    <div class="instruction">
      <span class="instruction-icon">💡</span>
      <span class="instruction-text">点击右下角的悬浮球按钮，打开扩展模式聊天窗口</span>
    </div>

    <div class="features">
      <div class="feature">
        <h3>悬浮球按钮</h3>
        <p>页面右下角显示悬浮球，可拖动调整位置</p>
      </div>
      <div class="feature">
        <h3>扩展模式弹窗</h3>
        <p>点击打开完整的桌面聊天界面</p>
      </div>
      <div class="feature">
        <h3>会话管理</h3>
        <p>支持左侧会话列表</p>
      </div>
      <div class="feature">
        <h3>不遮挡内容</h3>
        <p>默认收起，不影响页面浏览</p>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/entries/floating-extended.ts"></script>
</body>
</html>
